[project]
name = "opensmell"
version = "2.0.0"
description = "OpenSmell SDK — extract device-agnostic framework features from electronic nose recordings"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["opensmell"]
