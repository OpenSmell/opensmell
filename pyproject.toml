[project]
name = "opensmell"
version = "3.0.1"
description = "OpenSmell SDK — modular digital-olfaction framework: .osmell I/O, quality scoring, and sensor-specific feature extraction (MOX, MIRIS, electrochemical)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "OpenSmell Project", email = "praise@opensmell.xyz" },
    { name = "Praise J.J.", email = "praisejx@proton.me" },
]
keywords = ["digital olfaction", "electronic nose", "gas sensors", "MOX", ".osmell"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
]

[project.urls]
Homepage = "https://opensmell.xyz"
Documentation = "https://opensmell.xyz/docs/python"
Repository = "https://github.com/OpenSmell/opensmell"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opensmell*"]

[tool.setuptools.package-data]
"opensmell.constants" = ["*.json"]
